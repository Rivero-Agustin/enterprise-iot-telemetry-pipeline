apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-consumer
  namespace: iot-pipeline
  labels:
    app.kubernetes.io/name: backend-consumer
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-consumer
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: node-consumer
          image: enterprise-iot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-telemetry
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          livenessProbe:
            httpGet:
              path: /api/telemetry
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/telemetry
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
