name: "Terraform GitOps"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: "Checkout del Código"
        uses: actions/checkout@v4

      - name: "Configurar Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Validar Formato (terraform fmt)"
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: "Inicializar Backend (terraform init)"
        id: init
        run: terraform init

      - name: "Validar Sintaxis (terraform validate)"
        id: validate
        run: terraform validate -no-color

      # -------------------------------------------------------------
      # PLAN (Solo para Pull Requests)
      # -------------------------------------------------------------
      - name: "Generar Plan Predictivo (terraform plan)"
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: "Comentar Plan en el Pull Request"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('./terraform/plan.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + '\n... [Plan truncado por límite de caracteres]';
              }
            } catch (err) {
              planOutput = 'Error leyendo el archivo de plan: ' + err.message;
            }

            const output = `### 🚀 Resultado de Terraform GitOps
            #### Formato de Código: \`${{ steps.fmt.outcome }}\`
            #### Inicialización: \`${{ steps.init.outcome }}\`
            #### Validación: \`${{ steps.validate.outcome }}\`
            #### Plan de Ejecución: \`${{ steps.plan.outcome }}\`

            <details><summary>Ver detalles de Terraform Plan</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Actor: @${{ github.actor }}, Acción: \`${{ github.event_name }}\`, Rama: \`${{ github.head_ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: "Verificar Estado del Plan"
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # -------------------------------------------------------------
      # APPLY (Solo tras Merge a la rama principal 'main')
      # -------------------------------------------------------------
      - name: "Desplegar Infraestructura (terraform apply)"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
